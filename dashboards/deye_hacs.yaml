  # ==========================================================
  # TOU
  # ==========================================================
  - title: TOU
    path: tou
    icon: mdi:calendar-clock
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Inverter vs draft vs snapshot
            icon: mdi:compare-horizontal
          - type: markdown
            visibility:
              - condition: state
                entity: input_boolean.elfin_deye_tou_emergency
                state: "on"
            content: >
              <ha-alert alert-type="error" title="Emergency mode active">
              All six TOU SOC targets are 100% since
              {{ states('input_datetime.elfin_deye_tou_emergency_started')[:16] }}.
              Apply is blocked until the normal profile is restored.
              </ha-alert>
            grid_options:
              columns: full
          # Three bars, same rule as the Home bar. Draft and snapshot use
          # the inverter's grid-charge flags (the drafts only change SOC).
          # Draft cells that differ from the inverter get a dashed outline.
          - type: markdown
            content: |-
              {%- set rows = [
                ['Inverter', 'sensor.elfin_deye_tou_start_time_slot_', 'sensor.elfin_deye_tou_soc_slot_', ''],
                ['Draft', 'sensor.elfin_deye_tou_start_time_slot_', 'input_number.elfin_deye_tou_soc_', '_draft'],
                ['Saved snapshot', 'input_text.elfin_deye_tou_snapshot_time_', 'input_number.elfin_deye_tou_snapshot_soc_', ''],
              ] -%}
              {%- for r in rows -%}
                {%- set ns = namespace(m=[], segs=[]) -%}
                {%- for i in range(1, 7) -%}
                  {%- set t = states(r[1] ~ i) -%}
                  {%- if t | length == 5 and t[2] == ':' -%}
                    {%- set ns.m = ns.m + [(t[:2] | int) * 60 + (t[3:] | int)] -%}
                  {%- endif -%}
                {%- endfor -%}
              {{ r[0] }}{{ '\n\n' }}
                {%- if ns.m | length < 6 -%}
              (start times not available){{ '\n\n' }}
                {%- else -%}
                  {%- if ns.m[0] > 0 -%}{%- set ns.segs = [[6, 0, ns.m[0]]] -%}{%- endif -%}
                  {%- for i in range(6) -%}
                    {%- set ns.segs = ns.segs + [[i + 1, ns.m[i], ns.m[i + 1] if i < 5 else 1440]] -%}
                  {%- endfor -%}
              <table width="100%"><tr>
                  {%- for s in ns.segs if s[2] > s[1] -%}
                    {%- set w = (s[2] - s[1]) / 14.4 -%}
                    <td width="{{ w | round(2) }}%">
                    {%- if w >= 12.5 -%}
                      {%- if is_state('binary_sensor.elfin_deye_tou_grid_charge_slot_' ~ s[0], 'on') %}<ha-icon icon="mdi:flash"></ha-icon>{% endif -%}
                      {{ states(r[2] ~ s[0] ~ r[3]) | int(0) }}%
                    {%- endif -%}
                    </td>
                  {%- endfor -%}
              </tr></table>{{ '\n\n' }}
                {%- endif -%}
              {%- endfor -%}
              <table width="100%"><tr><td width="25%">00</td><td width="25%">06</td><td width="25%">12</td><td width="25%">18</td></tr></table>
            card_mod:
              style:
                ha-markdown$: |
                  {%- set rows = [
                    ['sensor.elfin_deye_tou_start_time_slot_', 'sensor.elfin_deye_tou_soc_slot_', ''],
                    ['sensor.elfin_deye_tou_start_time_slot_', 'input_number.elfin_deye_tou_soc_', '_draft'],
                    ['input_text.elfin_deye_tou_snapshot_time_', 'input_number.elfin_deye_tou_snapshot_soc_', ''],
                  ] -%}
                  table { display: table !important; width: 100%; table-layout: fixed; border-collapse: separate !important; border-spacing: 2px 0; border: 0 !important; margin: 0; position: relative; }
                  td { border: 0 !important; }
                  table:not(:last-of-type) td { height: 40px; padding: 3px 6px !important; vertical-align: top; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; border-radius: 6px; background-color: rgba(127, 127, 127, 0.12); --mdc-icon-size: 14px; }
                  table:last-of-type td { padding: 3px 0 0 !important; font-size: 11px; color: var(--secondary-text-color); }
                  p { margin: 10px 0 4px; font-size: 12px; color: var(--secondary-text-color); }
                  {%- for r in rows %}
                  {%- set ri = loop.index %}
                  {%- set ns = namespace(m=[], segs=[]) %}
                  {%- for i in range(1, 7) %}
                    {%- set t = states(r[0] ~ i) %}
                    {%- if t | length == 5 and t[2] == ':' %}
                      {%- set ns.m = ns.m + [(t[:2] | int) * 60 + (t[3:] | int)] %}
                    {%- endif %}
                  {%- endfor %}
                  {%- if ns.m | length == 6 %}
                    {%- if ns.m[0] > 0 %}{%- set ns.segs = [[6, 0, ns.m[0]]] %}{%- endif %}
                    {%- for i in range(6) %}
                      {%- set ns.segs = ns.segs + [[i + 1, ns.m[i], ns.m[i + 1] if i < 5 else 1440]] %}
                    {%- endfor %}
                  {%- endif %}
                  {%- for s in ns.segs if s[2] > s[1] %}
                  {%- set soc = states(r[1] ~ s[0] ~ r[2]) | int(0) %}
                  {%- set h = (soc * 0.6) | round(1) %}
                  {%- set c = '#3b82f6' if is_state('binary_sensor.elfin_deye_tou_grid_charge_slot_' ~ s[0], 'on') else '#0d9488' %}
                  table:nth-of-type({{ ri }}) td:nth-child({{ loop.index }}) { background-image: linear-gradient(to top, {{ c }} {{ h }}%, transparent {{ h }}%);{% if ri == 2 and soc != states('sensor.elfin_deye_tou_soc_slot_' ~ s[0]) | int(0) %} outline: 2px dashed var(--primary-text-color); outline-offset: -2px;{% endif %} }
                  {%- endfor %}
                  {%- endfor %}
                  table:first-of-type::after { content: ""; position: absolute; top: -3px; bottom: -3px; width: 2px; left: {{ ((now().hour * 60 + now().minute) / 14.4) | round(2) }}%; background: var(--primary-text-color); }
                  {%- if is_state('input_boolean.elfin_deye_tou_emergency', 'on') %}
                  table:first-of-type { outline: 2px solid #ef4444; outline-offset: 3px; border-radius: 8px; }
                  {%- endif %}
            grid_options:
              columns: full

      # ---------------- draft editor ----------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Normal SOC profile (draft)
            icon: mdi:pencil
          # Sliders for the drafts; the helpers keep their own mode. The
          # value is drawn right of the slider by card-mod (Jinja); it
          # updates when the slider is released.
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_1_draft
            name: Slot 1
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_2_draft
            name: Slot 2
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_3_draft
            name: Slot 3
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_4_draft
            name: Slot 4
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_5_draft
            name: Slot 5
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-number-card
            entity: input_number.elfin_deye_tou_soc_6_draft
            name: Slot 6
            icon_type: none
            layout: horizontal
            primary_info: name
            secondary_info: none
            display_mode: slider
            icon_color: "#0d9488"
            card_mod:
              style: |
                .actions::after {
                  content: "{{ states(config.entity) | int(0) }}%";
                  align-self: center;
                  min-width: 44px;
                  text-align: right;
                  font-weight: 500;
                  color: var(--primary-text-color);
                }
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: Apply to inverter
            secondary: >-
              {% set ns = namespace(d=[]) %}
              {% for i in range(1, 7) %}
                {% if states('input_number.elfin_deye_tou_soc_' ~ i ~ '_draft') | int(-1)
                      != states('sensor.elfin_deye_tou_soc_slot_' ~ i) | int(-1) %}
                  {% set ns.d = ns.d + [i | string] %}
                {% endif %}
              {% endfor %}
              {% if is_state('sensor.elfin_deye_tou_soc_draft_status', 'matches_actual') %}Draft = inverter
              {% elif is_state('sensor.elfin_deye_tou_soc_draft_status', 'draft_differs') %}Draft differs in slot{{ 's' if ns.d | count > 1 }} {{ ns.d | join(', ') }}
              {% else %}Draft status unavailable{% endif %}
            icon: mdi:content-save-cog
            color: "#0d9488"
            visibility:
              - condition: state
                entity: input_boolean.elfin_deye_tou_emergency
                state: "off"
              - condition: state
                entity: input_boolean.elfin_deye_tou_snapshot_valid
                state: "on"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.elfin_deye_tou_apply_normal_soc_profile
              confirmation:
                text: Write the six draft SOC values to the inverter?
            grid_options:
              columns: full

      # ---------------- snapshot and safety ----------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Saved snapshot
            icon: mdi:content-save
          - type: markdown
            content: >
              Captured {{ states('input_datetime.elfin_deye_tou_snapshot_captured_at')[:16] }}.
              Last action: {{ states('input_text.elfin_deye_tou_last_action') }}
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            entity: binary_sensor.elfin_deye_tou_write_allowed
            primary: "{{ 'Yes' if is_state(entity, 'on') else 'No' }}"
            secondary: Writable
            icon: mdi:lock-open-check
            color: "{{ '#22c55e' if is_state(entity, 'on') else '#f97316' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: binary_sensor.elfin_deye_tou_restore_available
            primary: "{{ 'Yes' if is_state(entity, 'on') else 'No' }}"
            secondary: Restore
            icon: mdi:backup-restore
            color: "{{ '#22c55e' if is_state(entity, 'on') else '#f97316' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: input_boolean.elfin_deye_tou_write_lock
            primary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
            secondary: Write lock
            icon: mdi:lock
            color: "{{ '#f97316' if is_state(entity, 'on') else 'disabled' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            primary: Capture from inverter
            secondary: Replace the snapshot and the drafts
            icon: mdi:content-save-outline
            color: "#8b8f96"
            visibility:
              - condition: state
                entity: input_boolean.elfin_deye_tou_emergency
                state: "off"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.elfin_deye_tou_capture_snapshot
              confirmation:
                text: >-
                  Read the current SOC profile from the inverter and replace
                  the saved snapshot and the drafts?
            grid_options:
              columns: full

  # ==========================================================
  # DIAGNOSTICS
  # ==========================================================
  - title: Diagnostics
    path: diagnostics
    icon: mdi:tools
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Grid outages
            icon: mdi:history
          - type: custom:mushroom-template-card
            entity: sensor.elfin_deye_grid_outage_time_today_formatted
            primary: "{{ states(entity) }}"
            secondary: "Today · {{ states('sensor.elfin_deye_grid_outage_count_today') | int(0) }}"
            icon: mdi:transmission-tower-off
            color: "{{ '#ef4444' if states('sensor.elfin_deye_grid_outage_count_today') | int(0) > 0 else 'disabled' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: sensor.elfin_deye_grid_outage_time_week_formatted
            primary: "{{ states(entity) }}"
            secondary: "Week · {{ states('sensor.elfin_deye_grid_outage_count_week') | int(0) }}"
            icon: mdi:transmission-tower-off
            color: "{{ '#ef4444' if states('sensor.elfin_deye_grid_outage_count_week') | int(0) > 0 else 'disabled' }}"
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: sensor.elfin_deye_grid_outage_time_month_formatted
            primary: "{{ states(entity) }}"
            secondary: "Month · {{ states('sensor.elfin_deye_grid_outage_count_month') | int(0) }}"
            icon: mdi:transmission-tower-off
            color: "{{ '#ef4444' if states('sensor.elfin_deye_grid_outage_count_month') | int(0) > 0 else 'disabled' }}"
            tap_action:
