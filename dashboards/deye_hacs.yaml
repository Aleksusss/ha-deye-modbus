            grid_options:
              columns: 4
          - type: tile
            entity: sensor.elfin_deye_last_grid_outage_duration
            name: Last outage
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Clock sync
            icon: mdi:clock-check-outline
          - type: custom:mushroom-template-card
            entity: sensor.elfin_deye_clock_display
            # "YYYY-MM-DD HH:MM:SS" -> time only; the date is in more-info.
            primary: "{{ states(entity)[11:] if states(entity) | length == 19 else states(entity) }}"
            secondary: Clock
            icon: mdi:clock-outline
            color: disabled
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: sensor.elfin_deye_clock_offset
            primary: "{{ '%+d' | format(states(entity) | float(0) | round(0) | int) }} s"
            secondary: Offset
            icon: >-
              {{ 'mdi:clock-alert-outline' if is_state('binary_sensor.elfin_deye_clock_needs_sync', 'on') else 'mdi:clock-check-outline' }}
            color: >-
              {{ '#f97316' if is_state('binary_sensor.elfin_deye_clock_needs_sync', 'on') else '#22c55e' }}
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            entity: script.elfin_deye_sync_clock_once
            # Compact age ("5d ago", "3h ago", "12m ago") so it fits on a phone.
            primary: >-
              {%- set t = state_attr(entity, 'last_triggered') -%}
              {%- if t -%}
                {%- set sec = (now() - t).total_seconds() | int -%}
                {%- if sec >= 86400 -%}{{ sec // 86400 }}d{%- elif sec >= 3600 -%}{{ sec // 3600 }}h{%- else -%}{{ sec // 60 }}m{%- endif %} ago
              {%- else -%}never{%- endif -%}
            secondary: Last sync
            icon: mdi:clock-check-outline
            color: disabled
            tap_action:
              action: more-info
            grid_options:
              columns: 4
          - type: custom:apexcharts-card
            graph_span: 7d
            header:
              show: false
            yaxis:
              - decimals: 0
                apex_config:
                  forceNiceScale: true
            series:
              - entity: sensor.elfin_deye_clock_offset
                name: Offset
                color: "#8b8f96"
                stroke_width: 2
                curve: smooth
                group_by:
                  func: avg
                  duration: 1h
            apex_config:
              chart:
                height: 110
              legend:
                show: false
              grid:
                borderColor: rgba(127, 127, 127, 0.15)
            grid_options:
              columns: full
          - type: markdown
            content: >
              {% set s = state_attr('script.elfin_deye_sync_clock_once', 'last_triggered') %}
              {% set c = state_attr('automation.elfin_deye_automatic_clock_synchronization', 'last_triggered') %}
              Offset, 7 days. Checked daily at 03:05, after a restart and
              after 10 min over 60 s; written only when |offset| > 60 s.
              Last check {{ as_timestamp(c) | timestamp_custom('%Y-%m-%d %H:%M') if c else 'never' }},
              last sync {{ as_timestamp(s) | timestamp_custom('%Y-%m-%d %H:%M') if s else 'never' }}.
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: Sync clock now
            secondary: Write Home Assistant's time to the inverter
            icon: mdi:timer-sync-outline
            color: "#8b8f96"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.elfin_deye_sync_clock_once
              confirmation:
                text: Write Home Assistant's time to the inverter clock?
            grid_options:
              columns: full

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: BMS and temperatures
