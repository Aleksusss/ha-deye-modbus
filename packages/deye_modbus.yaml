template:
  - sensor:
      # ========================================================
      # GRID IMPORT TOTAL — 32-bit, decoded from 78 (low) + 80 (high)
      #
      # The availability guard turns a failed or all-zero read into a
      # gap. Without it a single "0,0" would look like a meter reset to
      # total_increasing, and the next good read would book the whole
      # lifetime counter into the Energy dashboard a second time.
      # ========================================================
      - name: Elfin Deye Grid Import Total
        unique_id: elfin_deye_grid_import_total
        icon: mdi:transmission-tower-import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {% set raw = states('sensor.elfin_deye_grid_import_total_raw').split(',') %}
          {{ raw | count == 2
             and raw[0] | is_number and raw[1] | is_number
             and (raw[0] | int(0)) + (raw[1] | int(0)) > 0 }}
        state: >
          {% set raw = states('sensor.elfin_deye_grid_import_total_raw').split(',') %}
          {{ (((raw[1] | int(0)) * 65536 + (raw[0] | int(0))) * 0.1) | round(1) }}
