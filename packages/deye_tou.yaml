# ============================================================
# Deye TOU program — read-only view
#
# Requires deye_modbus.yaml (the *_raw TOU sensors). Template sensors
# only: no Modbus hub, no writes. Writing SOC targets is in
# deye_tou_control.yaml.
#
# Grid-charge flags, registers 274-279 (one per slot):
#   bits 0-1  charge source  0 none, 1 grid, 2 generator, 3 grid + gen
#   bits 2-4  slot mode      (1 << 2 = "General")
# Observed on the inverter: 5 with the LCD "Grid" box ticked,
# 4 with it cleared (= mode "General" with / without grid charge).
# Grid charge is therefore bit 0. The layout matches the
# kellerza/sunsynk single-phase map; values other than 4 and 5 have
# NOT been observed on this inverter.
# ============================================================

template:
  - sensor:
      # ========================================================
      # START TIMES — raw HHMM -> "HH:MM"
      # ========================================================
      - name: Elfin Deye TOU Start Time Slot 1
        unique_id: elfin_deye_tou_start_time_slot_1
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_1_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      - name: Elfin Deye TOU Start Time Slot 2
        unique_id: elfin_deye_tou_start_time_slot_2
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_2_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      - name: Elfin Deye TOU Start Time Slot 3
        unique_id: elfin_deye_tou_start_time_slot_3
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_3_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      - name: Elfin Deye TOU Start Time Slot 4
        unique_id: elfin_deye_tou_start_time_slot_4
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_4_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      - name: Elfin Deye TOU Start Time Slot 5
        unique_id: elfin_deye_tou_start_time_slot_5
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_5_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      - name: Elfin Deye TOU Start Time Slot 6
        unique_id: elfin_deye_tou_start_time_slot_6
        icon: mdi:clock-outline
        state: >
          {% set v = states('sensor.elfin_deye_tou_start_time_slot_6_raw') | int(-1) %}
          {% if 0 <= v <= 2359 and (v % 100) < 60 %}
            {{ '%02d:%02d' | format(v // 100, v % 100) }}
          {% else %}
            unknown
          {% endif %}

      # ========================================================
      # POWER — pass-through of the raw registers, kept so existing
      # dashboards and history that use these entity ids keep working.
      # ========================================================
      - name: Elfin Deye TOU Power Slot 1
        unique_id: elfin_deye_tou_power_slot_1
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_1_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_1_raw') }}"

      - name: Elfin Deye TOU Power Slot 2
        unique_id: elfin_deye_tou_power_slot_2
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_2_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_2_raw') }}"

      - name: Elfin Deye TOU Power Slot 3
        unique_id: elfin_deye_tou_power_slot_3
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_3_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_3_raw') }}"

      - name: Elfin Deye TOU Power Slot 4
        unique_id: elfin_deye_tou_power_slot_4
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_4_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_4_raw') }}"

      - name: Elfin Deye TOU Power Slot 5
        unique_id: elfin_deye_tou_power_slot_5
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_5_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_5_raw') }}"

      - name: Elfin Deye TOU Power Slot 6
        unique_id: elfin_deye_tou_power_slot_6
        icon: mdi:flash
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.elfin_deye_tou_power_slot_6_raw') }}"
        state: "{{ states('sensor.elfin_deye_tou_power_slot_6_raw') }}"

      # ========================================================
      # GRID CHARGE — summary over all six slots
      # ========================================================
      - name: Elfin Deye TOU Grid Charge State
        unique_id: elfin_deye_tou_grid_charge_state
        icon: mdi:battery-charging
        state: >
          {% set raw = [
            states('sensor.elfin_deye_tou_grid_charge_slot_1_raw') | int(-1),
            states('sensor.elfin_deye_tou_grid_charge_slot_2_raw') | int(-1),
            states('sensor.elfin_deye_tou_grid_charge_slot_3_raw') | int(-1),
            states('sensor.elfin_deye_tou_grid_charge_slot_4_raw') | int(-1),
            states('sensor.elfin_deye_tou_grid_charge_slot_5_raw') | int(-1),
            states('sensor.elfin_deye_tou_grid_charge_slot_6_raw') | int(-1)
          ] %}
          {% if raw | select('lt', 0) | list | count > 0 %}
            not_verified
          {% else %}
            {% set on = raw | map('bitwise_and', 1) | select('eq', 1) | list | count %}
            {% if on == 6 %}all_on{% elif on == 0 %}all_off{% else %}mixed{% endif %}
          {% endif %}
        attributes:
          slot_1_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_1_raw') }}"
          slot_2_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_2_raw') }}"
          slot_3_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_3_raw') }}"
          slot_4_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_4_raw') }}"
          slot_5_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_5_raw') }}"
          slot_6_raw: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_6_raw') }}"

      # ========================================================
      # ACTIVE SLOT and its SOC target
      #
      # Active = the slot with the latest start time not after now.
      # Before the earliest start (e.g. 00:30 with slot 1 at 01:00)
      # the last slot of the day is still running from yesterday.
      # Uses Home Assistant's clock; the inverter follows its own, which
      # the clock automation keeps within 60 s.
      # now() makes the template re-render every minute.
      # ========================================================
      - name: Elfin Deye TOU Active Slot
        unique_id: elfin_deye_tou_active_slot
        icon: mdi:calendar-clock
        availability: >
          {% set ns = namespace(ok=true) %}
          {% for i in range(1, 7) %}
            {% set t = states('sensor.elfin_deye_tou_start_time_slot_' ~ i) %}
            {% if not (t | length == 5 and t[2] == ':') %}{% set ns.ok = false %}{% endif %}
          {% endfor %}
          {{ ns.ok }}
        state: >
          {% set nowm = now().hour * 60 + now().minute %}
          {% set ns = namespace(active=0, best=-1, last=0, lastm=-1) %}
          {% for i in range(1, 7) %}
            {% set t = states('sensor.elfin_deye_tou_start_time_slot_' ~ i) %}
            {% set m = (t[:2] | int) * 60 + (t[3:] | int) %}
            {% if m <= nowm and m > ns.best %}{% set ns.best = m %}{% set ns.active = i %}{% endif %}
            {% if m > ns.lastm %}{% set ns.lastm = m %}{% set ns.last = i %}{% endif %}
          {% endfor %}
          {{ ns.active if ns.active else ns.last }}

      # SOC target of the active slot. Follows Emergency mode on its own:
      # the slot SOC sensors are read back from the inverter.
      - name: Elfin Deye TOU Target SOC
        unique_id: elfin_deye_tou_target_soc
        icon: mdi:battery-arrow-up-outline
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{ has_value('sensor.elfin_deye_tou_active_slot')
             and has_value('sensor.elfin_deye_tou_soc_slot_' ~ states('sensor.elfin_deye_tou_active_slot')) }}
        state: >
          {{ states('sensor.elfin_deye_tou_soc_slot_' ~ states('sensor.elfin_deye_tou_active_slot')) | int(0) }}

  - binary_sensor:
      # ========================================================
      # GRID CHARGE — per slot (bit 0)
      # ========================================================
      - name: Elfin Deye TOU Grid Charge Slot 1
        unique_id: elfin_deye_tou_grid_charge_slot_1
        icon: mdi:transmission-tower-import
        availability: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_1_raw') | int(-1) >= 0 }}"
        state: "{{ states('sensor.elfin_deye_tou_grid_charge_slot_1_raw') | int(0) | bitwise_and(1) == 1 }}"

