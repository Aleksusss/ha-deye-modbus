# ============================================================
# Deye — grid outage detection, statistics and notifications
#
# Optional module. Requires deye_modbus.yaml and deye_notify.yaml.
#
# Signal: register 194 (inverter grid relay), sensor
# sensor.elfin_deye_grid_connected. NOT the AC voltage (register 150):
# it can hold its last value while the grid is down, so it is used
# neither for detection nor in the "grid lost" message.
#
# After the grid returns, 194 stays 0 for ~70 s while the inverter
# checks grid stability. Outage durations therefore include that
# reconnect wait: they measure time actually spent on battery.
#
# False-alarm protection:
#   1. Grid Available has an availability guard: a missing Modbus read
#      becomes "unavailable", never "off".
#   2. A 2-minute startup grace flag gates every alert after a restart.
#   3. Readings are snapshotted into automation variables at trigger
#      time, so the value that passed the check is the value reported.
#
# Restarts during an outage: a restart resets last_changed of Grid
# Available, so durations measured from it were cut short (an outage of
# 3h25m was once reported as 0h54m). The outage start is therefore kept
# in two restored helpers, set once when an outage begins and never
# overwritten while it lasts:
#   input_boolean.elfin_deye_grid_outage_active
#   input_datetime.elfin_deye_grid_outage_started
# If the grid returned while HA was down, the startup bootstrap closes
# the outage after the grace period and reports it.
# Known gaps: an outage that STARTS within the 2-minute grace gets no
# "lost" alert (its start is still recorded, and "restored" is sent);
# one that started while HA was down is timed from HA's start.
#
# Verified: a 10-15 s breaker test (2026-10-06) and a real 18-minute
# outage (2026-10-07) both produced "lost" and "restored" on time.
# NOT VERIFIED: behaviour on a real sub-second grid dip.
# ============================================================

input_boolean:
  elfin_deye_system_ready:
    name: Elfin Deye System Ready
    icon: mdi:check-decagram
    # initial: false on purpose: the flag must come up "off" after every
    # restart and only turn on when the bootstrap automation's grace
    # period ends. Restoring "on" would open alerts before Modbus is up.
    initial: false
  # Restored across restarts on purpose (no initial:): "on" means an
  # outage is in progress and its start is in the input_datetime below.
  elfin_deye_grid_outage_active:
    name: Elfin Deye Grid Outage Active
    icon: mdi:transmission-tower-off

input_datetime:
  elfin_deye_grid_outage_started:
    name: Elfin Deye Grid Outage Started
    has_date: true
    has_time: true

input_number:
  elfin_deye_soc_low_threshold:
    name: Elfin Deye SOC Low Threshold
    icon: mdi:battery-low
    min: 5
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "%"

template:
  # ========================================================
  # GRID AVAILABILITY + CURRENT OUTAGE DURATION
  #
  # The availability guard is coupled to the outage automation below,
  # which has NO `from: "on"` on its trigger:
  #   - With the guard, an outage that starts during a comms hiccup
  #     arrives as unavailable -> off, which `from: "on"` would miss.
  #   - If the guard is ever removed, `from: "on"` MUST come back:
  #     without the guard unavailable -> off is exactly the false-alarm
  #     path.
  # Tradeoff: if the gateway loses power together with the grid, this
  # sensor goes unavailable rather than off and no alert is sent. Power
  # the gateway from the inverter's backup output, or monitor it.
  # ========================================================
  - binary_sensor:
      - name: Elfin Deye Grid Available
        unique_id: elfin_deye_grid_available
        device_class: power
        icon: mdi:transmission-tower
        state: >
          {{ states('sensor.elfin_deye_grid_connected') | int(0) == 1 }}
        availability: >
          {{ states('sensor.elfin_deye_grid_connected') | is_number }}

      - name: Elfin Deye Low SOC
        unique_id: elfin_deye_low_soc
        icon: mdi:battery-alert
        state: >
          {{
            states('sensor.elfin_deye_battery_soc') | float(100)
            <= states('input_number.elfin_deye_soc_low_threshold') | float(24)
          }}
        availability: >
          {{ has_value('sensor.elfin_deye_battery_soc') }}

    sensor:
      - name: Elfin Deye Grid Outage Duration Now
        unique_id: elfin_deye_grid_outage_duration_now
        icon: mdi:transmission-tower-off
        state: >
          {% if is_state('binary_sensor.elfin_deye_grid_available', 'off') %}
            {# now() is referenced on purpose: a template only re-renders
               when an entity it reads changes, and Grid Available does not
               change during an outage. Without now() the counter would
               freeze at the moment the outage began. #}
            {% set _ = now() %}
            {# Prefer the recorded start: it survives restarts. #}
            {% set start = state_attr('input_datetime.elfin_deye_grid_outage_started', 'timestamp') %}
            {% if is_state('input_boolean.elfin_deye_grid_outage_active', 'on') and start is number %}
              {{ time_since(as_datetime(start)) }}
            {% else %}
              {{ time_since(states.binary_sensor.elfin_deye_grid_available.last_changed) }}
            {% endif %}
          {% else %}
            —
          {% endif %}

      # Wrap the history_stats sensors below (fractional hours).
      - name: Elfin Deye Grid Outage Time Today Formatted
        unique_id: elfin_deye_grid_outage_time_today_fmt
        icon: mdi:timer-sand
        state: >
          {% set total_minutes = (states('sensor.elfin_deye_grid_outage_time_today') | float(0) * 60) | round(0) | int %}
          {{ '%dh %02dm' | format(total_minutes // 60, total_minutes % 60) }}

      - name: Elfin Deye Grid Outage Time Week Formatted
        unique_id: elfin_deye_grid_outage_time_week_fmt
        icon: mdi:timer-sand
        state: >
          {% set total_minutes = (states('sensor.elfin_deye_grid_outage_time_week') | float(0) * 60) | round(0) | int %}
          {{ '%dh %02dm' | format(total_minutes // 60, total_minutes % 60) }}

      - name: Elfin Deye Grid Outage Time Month Formatted
        unique_id: elfin_deye_grid_outage_time_month_fmt
        icon: mdi:timer-sand
        state: >
          {% set total_minutes = (states('sensor.elfin_deye_grid_outage_time_month') | float(0) * 60) | round(0) | int %}
          {{ '%dh %02dm' | format(total_minutes // 60, total_minutes % 60) }}

  # ========================================================
  # LAST COMPLETED OUTAGE DURATION (trigger-based)
  #
  # Start = the recorded outage start while an outage is active (it
  # survives restarts), else when Grid Available went off. The recorded
  # start is only used if it is not later than that, as a sanity check.
  # The "restored" automation clears the active flag 20 s later, so the
  # flag is still on when this renders.
  # ========================================================
  - triggers:
      - trigger: state
        entity_id: binary_sensor.elfin_deye_grid_available
        from: "off"
        to: "on"
    variables:
      off_ts: "{{ as_timestamp(trigger.from_state.last_changed) }}"
      rec_ts: "{{ state_attr('input_datetime.elfin_deye_grid_outage_started', 'timestamp') }}"
      start_ts: >
        {{ rec_ts if is_state('input_boolean.elfin_deye_grid_outage_active', 'on')
                     and rec_ts is number and rec_ts <= off_ts
           else off_ts }}
      delta: "{{ (as_timestamp(trigger.to_state.last_changed) - start_ts) | int }}"
    sensor:
      - name: Elfin Deye Last Grid Outage Duration
        unique_id: elfin_deye_last_grid_outage_duration
        icon: mdi:history
        state: >
          {{ '%dh %02dm' | format(delta // 3600, (delta % 3600) // 60) }}
        attributes:
          duration_seconds: "{{ delta }}"
          # Lets the startup bootstrap tell whether this value belongs to
          # the outage it is closing.
          started_at: "{{ start_ts | int }}"
          ended_at: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"

# ========================================================
# OUTAGE COUNT / TIME — today, this week, this month
# ========================================================
sensor:
  - platform: history_stats
    name: Elfin Deye Grid Outage Time Today
    unique_id: elfin_deye_grid_outage_time_today
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Elfin Deye Grid Outage Time Week
    unique_id: elfin_deye_grid_outage_time_week
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(days=now().weekday()) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Elfin Deye Grid Outage Time Month
    unique_id: elfin_deye_grid_outage_time_month
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: time
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Elfin Deye Grid Outage Count Today
    unique_id: elfin_deye_grid_outage_count_today
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Elfin Deye Grid Outage Count Week
    unique_id: elfin_deye_grid_outage_count_week
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(days=now().weekday()) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Elfin Deye Grid Outage Count Month
    unique_id: elfin_deye_grid_outage_count_month
    entity_id: binary_sensor.elfin_deye_grid_available
    state: "off"
    type: count
    start: "{{ now().replace(day=1, hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

automation:
  # Startup grace: alerts stay closed for 2 minutes after a restart.
  - id: elfin_deye_startup_bootstrap
    alias: Elfin Deye — Startup Bootstrap
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
    variables:
      v_boot: "{{ as_timestamp(now()) | int }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elfin_deye_system_ready
      - delay: "00:02:00"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.elfin_deye_system_ready

      # Close an outage that ended while HA was down or during the grace
      # period (the "restored" automation stays silent during the grace).
      - if:
          - condition: state
            entity_id: input_boolean.elfin_deye_grid_outage_active
            state: "on"
          - condition: state
            entity_id: binary_sensor.elfin_deye_grid_available
            state: "on"
        then:
          - variables:
              v_start: "{{ state_attr('input_datetime.elfin_deye_grid_outage_started', 'timestamp') | int(0) }}"
              v_exact: >
                {{ v_start > 0 and
                   state_attr('sensor.elfin_deye_last_grid_outage_duration', 'started_at') | int(-1) == v_start }}
              v_upper: "{{ (as_timestamp(now()) | int) - v_start }}"
              v_soc: "{{ states('sensor.elfin_deye_battery_soc') }}"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.elfin_deye_grid_outage_active
          # Report only an outage that began BEFORE this start. One that
          # began and ended inside the grace period is closed silently,
          # like every other event in the grace (it may be a startup
          # artifact).
          - condition: template
            value_template: "{{ 0 < v_start < v_boot }}"
          - action: script.elfin_deye_notify_all
            data:
              title: "Deye: grid restored"
              message: >-
                External grid power is back (seen after a Home Assistant
                restart). Outage started at
                {{ v_start | timestamp_custom('%Y-%m-%d %H:%M') }}.
                {% if v_exact %}Outage duration: {{ states('sensor.elfin_deye_last_grid_outage_duration') }}.{% else %}It ended while Home Assistant was down, so the duration is at most {{ '%dh %02dm' | format(v_upper // 3600, (v_upper % 3600) // 60) }}.{% endif %}
                Battery SOC: {{ v_soc }}%.

  - id: elfin_deye_grid_outage_started
    alias: Elfin Deye — Grid Outage Started
    mode: single
    triggers:
      # No `from: "on"` — see the coupling note on Grid Available.
      - trigger: state
        entity_id: binary_sensor.elfin_deye_grid_available
        to: "off"
        for:
          seconds: 20
    variables:
      v_soc: "{{ states('sensor.elfin_deye_battery_soc') }}"
      # False when HA restarted in the middle of an outage: the sensor
      # comes back as unavailable -> off and re-triggers this, but the
      # outage (and its alert) already happened.
      v_new: "{{ is_state('input_boolean.elfin_deye_grid_outage_active', 'off') }}"
    actions:
      # Record the start once per outage, also during the startup grace.
      - if:
          - condition: template
            value_template: "{{ v_new }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.elfin_deye_grid_outage_started
            data:
              timestamp: "{{ as_timestamp(trigger.to_state.last_changed) }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.elfin_deye_grid_outage_active
      - condition: template
        value_template: "{{ v_new }}"
      - condition: state
        entity_id: input_boolean.elfin_deye_system_ready
        state: "on"
      - action: script.elfin_deye_notify_all
        data:
          title: "Deye: grid lost"
          message: >-
            External grid power has been lost.
            Battery SOC: {{ v_soc }}%.

  - id: elfin_deye_grid_restored
    alias: Elfin Deye — Grid Restored
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.elfin_deye_grid_available
        from: "off"
        to: "on"
        for:
          seconds: 20
    variables:
      v_soc: "{{ states('sensor.elfin_deye_battery_soc') }}"
      v_duration: "{{ states('sensor.elfin_deye_last_grid_outage_duration') }}"
      v_l1: "{{ states('sensor.elfin_deye_ac_l1_voltage') }}"
    conditions:
      # During the startup grace this does nothing at all, not even
      # clearing the active flag: the bootstrap closes the outage and
      # reports it when the grace ends.
      - condition: state
        entity_id: input_boolean.elfin_deye_system_ready
        state: "on"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.elfin_deye_grid_outage_active
      - action: script.elfin_deye_notify_all
        data:
          title: "Deye: grid restored"
          # Voltage is informational here: the grid is back, so the
          # register is live again. It does not gate the alert.
          message: >-
            External grid power is back.
            Outage duration: {{ v_duration }}.
            Battery SOC: {{ v_soc }}%.{% if v_l1 | is_number %}
            Grid voltage L1: {{ v_l1 }} V.{% endif %}

  - id: elfin_deye_low_soc_alert
    alias: Elfin Deye — Low Battery SOC Alert
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.elfin_deye_low_soc
        from: "off"
        to: "on"
        for:
          minutes: 10
    variables:
      v_soc: "{{ states('sensor.elfin_deye_battery_soc') }}"
      v_threshold: "{{ states('input_number.elfin_deye_soc_low_threshold') }}"
      v_grid: "{{ states('binary_sensor.elfin_deye_grid_available') }}"
    conditions:
      - condition: state
        entity_id: input_boolean.elfin_deye_system_ready
        state: "on"
      - condition: template
        value_template: "{{ v_soc | is_number }}"
    actions:
      - action: script.elfin_deye_notify_all
        data:
          title: "Deye: low battery SOC"
          message: >-
            Battery SOC is {{ v_soc }}%.
            Threshold: {{ v_threshold }}%.
            Grid available: {{ v_grid }}.
